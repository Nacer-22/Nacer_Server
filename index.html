    <script>
        const RENDER_API_URL = "https://key-system-yn0o.onrender.com/api/verify";
        let timerInterval;
        let savedCode = "";

        const inputField = document.getElementById("accessCode");
        const mainBtn = document.getElementById("mainBtn");
        const messageBox = document.getElementById("messageBox");
        const messageText = document.getElementById("messageText");
        const connectBtn = document.getElementById("connectBtn");

        function showMessage(msg, type) {
            messageText.innerText = msg;
            messageBox.className = `message-box show msg-${type}`;
        }

        function clearMessage() {
            messageBox.className = "message-box";
            messageText.innerText = "";
        }

        function getDeviceId() {
            let deviceId = localStorage.getItem('nacer_device_id');
            if (!deviceId) {
                deviceId = 'DEV-' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('nacer_device_id', deviceId);
            }
            return deviceId;
        }

        // --- دالة اللصق المحسنة للتعامل مع حظر المتصفحات ---
        async function pasteCode(event) {
            // منع الإرسال الافتراضي للزر
            if(event) event.preventDefault(); 
            
            try { 
                const text = await navigator.clipboard.readText(); 
                if(text) {
                    inputField.value = text; 
                    clearMessage();
                } else {
                    showMessage("الحافظة فارغة", "error");
                }
            } catch (err) { 
                // إذا فشل اللصق التلقائي، نطلب من المستخدم اللصق يدوياً
                showMessage("المتصفح يمنع اللصق التلقائي. يرجى الضغط مطولاً على الحقل واختيار (لصق).", "error");
                // إعطاء تركيز للحقل لتسهيل اللصق اليدوي
                inputField.focus();
            }
        }

        function copyCode() { 
            navigator.clipboard.writeText(savedCode).then(() => alert("✅ تم نسخ الكود!")); 
        }

        async function checkCode() {
            const inputCode = inputField.value.trim();
            
            if(!inputCode) { 
                showMessage("يرجى إدخال المفتاح أولاً", "error");
                return; 
            }

            clearMessage();
            const originalBtnHTML = mainBtn.innerHTML;
            mainBtn.innerHTML = '<i class="fa-solid fa-spinner"></i> جاري التحقق...';
            mainBtn.disabled = true;

            try {
                const deviceId = getDeviceId();
                const response = await fetch(RENDER_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: inputCode, device_id: deviceId })
                });
                
                const data = await response.json();

                if (data.valid === true) {
                    mainBtn.innerHTML = '<i class="fa-solid fa-check"></i> تم التحقق';
                    mainBtn.style.background = 'linear-gradient(180deg, #22c55e 0%, #166534 100%)';
                    mainBtn.style.borderColor = '#22c55e';
                    mainBtn.style.boxShadow = '0 4px 15px rgba(34, 197, 94, 0.4)';
                    showMessage("تم التحقق من المفتاح بنجاح", "success");

                    savedCode = inputCode;
                    document.getElementById("currentCode").innerText = inputCode;

                    setTimeout(() => {
                        document.getElementById("login-page").style.display = "none";
                        document.getElementById("main-page").style.display = "block";
                        if (data.expires_at) { startCountdown(data.expires_at); }
                    }, 800);

                } else {
                    let msg = "المفتاح غير صحيح"; 
                    if (data.reason === "code_expired") msg = "المفتاح منتهي الصلاحية";
                    if (data.reason === "max_devices_reached") msg = "هذا المفتاح مستخدم على جهاز آخر";
                    if (data.reason === "too_many_requests") msg = "محاولات كثيرة جداً، انتظر 15 دقيقة.";
                    if (data.reason === "code_not_found") msg = "هذا المفتاح غير موجود في النظام";
                    
                    showMessage(msg, "error");
                    mainBtn.innerHTML = originalBtnHTML;
                    mainBtn.disabled = false;
                }
            } catch (error) {
                showMessage("تعذر الاتصال بالسيرفر، حاول مرة أخرى", "error");
                mainBtn.innerHTML = originalBtnHTML;
                mainBtn.disabled = false;
            }
        }

        function startCountdown(expiryDateString) {
            const countdownText = document.getElementById("countdownText");
            const expiryDate = new Date(expiryDateString).getTime();
            if(timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = expiryDate - now;
                
                if (distance < 0) { 
                    clearInterval(timerInterval); 
                    countdownText.innerHTML = "00:00:00"; 
                    countdownText.style.color = "var(--primary-red)"; 
                    
                    connectBtn.classList.add("disabled");
                    connectBtn.innerText = "انتهى الاشتراك 🛑";
                    connectBtn.removeAttribute("onclick");
                    
                    return; 
                }
                
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                let displayHours = hours < 10 ? '0' + hours : hours;
                let displayMinutes = minutes < 10 ? '0' + minutes : minutes;
                let displaySeconds = seconds < 10 ? '0' + seconds : seconds;
                
                if (days > 0) { 
                    countdownText.innerHTML = `${days} يوم : ${displayHours}:${displayMinutes}:${displaySeconds}`; 
                } else { 
                    countdownText.innerHTML = `${displayHours}:${displayMinutes}:${displaySeconds}`; 
                }
            }, 1000);
        }

        // دالة اللصق مع معالجة حظر المتصفح
        async function pasteCode(event) {
            if(event) event.preventDefault(); 
            try { 
                const text = await navigator.clipboard.readText(); 
                if(text) {
                    inputField.value = text; 
                    clearMessage();
                } else {
                    showMessage("الحافظة فارغة", "error");
                }
            } catch (err) { 
                showMessage("المتصفح يمنع اللصق التلقائي. يرجى الضغط مطولاً على الحقل واختيار (لصق).", "error");
                inputField.focus();
            }
        }

        function copyCode() { 
            navigator.clipboard.writeText(savedCode).then(() => {
                showMessage("تم نسخ الكود!", "success");
                setTimeout(clearMessage, 2000);
            }); 
        }

        // دالة التحقق
        async function checkCode() {
            const inputCode = inputField.value.trim();
            
            if(!inputCode) { 
                showMessage("يرجى إدخال المفتاح أولاً", "error");
                return; 
            }

            clearMessage();
            const originalBtnHTML = mainBtn.innerHTML;
            mainBtn.innerHTML = '<i class="fa-solid fa-spinner"></i> جاري التحقق...';
            mainBtn.disabled = true;

            try {
                const deviceId = getDeviceId();
                const response = await fetch(RENDER_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: inputCode, device_id: deviceId })
                });
                
                const data = await response.json();

                if (data.valid === true) {
                    // حالة النجاح
                    mainBtn.innerHTML = '<i class="fa-solid fa-check"></i> تم التحقق';
                    mainBtn.style.background = 'linear-gradient(180deg, #22c55e 0%, #166534 100%)';
                    mainBtn.style.borderColor = '#22c55e';
                    mainBtn.style.boxShadow = '0 4px 15px rgba(34, 197, 94, 0.4)';
                    showMessage("تم التحقق من المفتاح بنجاح", "success");

                    savedCode = inputCode;
                    document.getElementById("currentCode").innerText = inputCode;

                    // الانتقال للشاشة الثانية بعد نصف ثانية
                    setTimeout(() => {
                        document.getElementById("login-page").style.display = "none";
                        document.getElementById("main-page").style.display = "block";
                        if (data.expires_at) { startCountdown(data.expires_at); }
                    }, 800);

                } else {
                    // حالات الخطأ
                    let msg = "المفتاح غير صحيح"; 
                    if (data.reason === "code_expired") msg = "المفتاح منتهي الصلاحية";
                    if (data.reason === "max_devices_reached") msg = "هذا المفتاح مستخدم على جهاز آخر";
                    if (data.reason === "too_many_requests") msg = "محاولات كثيرة جداً، انتظر 15 دقيقة.";
                    if (data.reason === "code_not_found") msg = "هذا المفتاح غير موجود في النظام";
                    
                    showMessage(msg, "error");
                    mainBtn.innerHTML = originalBtnHTML;
                    mainBtn.disabled = false;
                }
            } catch (error) {
                showMessage("تعذر الاتصال بالسيرفر، حاول مرة أخرى", "error");
                mainBtn.innerHTML = originalBtnHTML;
                mainBtn.disabled = false;
            }
        }
