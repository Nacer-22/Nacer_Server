<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body {
            /* هنا تم وضع الرابط المباشر لصورتك كخلفية */
            background-image: url('https://i.imgur.com/DXmoUmz.png');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* جعل المحتوى في الأسفل لأن الصورة تحتوي على الشعار في الأعلى */
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        .container {
            width: 100%; max-width: 400px; position: relative; z-index: 2;
            display: flex; flex-direction: column; align-items: center;
            background: rgba(5, 0, 0, 0.7); /* خلفية شفافة للمحتوى لضمان قراءة النص */
            padding: 25px 20px;
            border-radius: 15px;
            border: 1px solid rgba(230, 57, 70, 0.3);
            backdrop-filter: blur(5px);
        }

        /* العنوان */
        .title-container {
            display: flex; align-items: center; justify-content: center;
            gap: 15px; margin-bottom: 8px; width: 100%;
        }
        .title-line { flex: 1; height: 2px; background: linear-gradient(90deg, transparent, #e63946, transparent); }
        .title { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.4); }
        
        .subtitle { font-size: 14px; color: #ccc; margin-bottom: 25px; font-weight: 600; text-align: center; }

        /* خانة الإدخال (بشكل الصورة الثانية) */
        .input-box {
            display: flex; align-items: center; width: 100%;
            background-color: rgba(10, 0, 0, 0.9); border: 1px solid #e63946;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            padding: 5px 15px; margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.3), inset 0 0 10px rgba(230, 57, 70, 0.2);
        }
        .input-box i.fa-key { color: #e63946; font-size: 18px; margin-left: 10px; }
        .input-box input {
            flex: 1; background: transparent; border: none; color: #fff;
            font-size: 16px; padding: 12px 5px; font-family: monospace;
            text-align: left; direction: ltr; outline: none;
        }
        .input-box input::placeholder { color: #777; font-family: 'Cairo', sans-serif; direction: rtl; text-align: right; font-size: 14px; }
        .input-box .paste-btn {
            background: transparent; border: 1px solid #444; color: #aaa;
            padding: 6px 12px; border-radius: 6px; cursor: pointer;
            font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 5px; transition: 0.3s;
        }
        .input-box .paste-btn:hover { background: #222; color: #fff; border-color: #e63946; }

        /* صندوق المثال */
        .example-box {
            width: 100%; display: flex; align-items: center; gap: 10px;
            background-color: rgba(15, 15, 15, 0.8); border: 1px solid #222;
            border-radius: 8px; padding: 12px 15px; margin-bottom: 25px;
        }
        .example-box i { color: #e63946; font-size: 16px; }
        .example-box div { font-size: 13px; color: #aaa; font-weight: 600; }
        .example-box span { color: #e63946; font-family: monospace; font-size: 14px; direction: ltr; }

        /* رسالة الخطأ */
        .error-msg {
            display: none; color: #e63946; font-size: 14px; font-weight: bold;
            margin-bottom: 15px; text-align: center; width: 100%; text-shadow: 0 0 5px rgba(230, 57, 70, 0.5);
        }

        /* زر التحقق */
        .verify-btn {
            width: 100%; background: linear-gradient(180deg, #cc0000 0%, #550000 100%);
            color: #fff; border: 1px solid #ff1a1a;
            clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0 50%);
            padding: 16px; font-size: 20px; font-weight: 900; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: inset 0 0 20px rgba(255, 0, 0, 0.6), 0 0 20px rgba(255, 0, 0, 0.4);
            transition: 0.3s; margin-bottom: 25px;
        }
        .verify-btn:active { transform: scale(0.98); }

        /* رابط القناة في الأسفل */
        .channel-btn {
            width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;
            background-color: rgba(20, 0, 0, 0.8); border: 1px solid #e63946;
            color: #e63946; text-decoration: none; padding: 14px; border-radius: 8px;
            font-size: 15px; font-weight: bold; transition: 0.3s;
        }
        .channel-btn:hover { background-color: #e63946; color: #fff; }

        /* ================= الشاشة الثانية ================= */
        #main-page { display: none; text-align: center; width: 100%; }
        
        .download-btn-top {
            display: block; width: 100%; background: linear-gradient(90deg, #b31217, #e63946, #b31217);
            background-size: 200% auto; color: #fff; text-decoration: none; padding: 14px;
            border-radius: 8px; font-size: 15px; font-weight: 900; margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4); animation: shine 3s linear infinite;
        }
        .download-btn-top::before { content: '⬇️'; margin-left: 8px; }
        @keyframes shine { to { background-position: 200% center; } }

        .fire-container {
            position: relative; width: 120px; height: 120px; margin: 0 auto 30px auto;
            display: flex; justify-content: center; align-items: center;
        }
        .fire-container::before {
            content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%; background: conic-gradient(#ff0000, #ff8c00, #ff0000, #ff8c00, #ff0000);
            animation: rotateFire 3s linear infinite; filter: blur(8px); z-index: -1;
        }
        .fire-profile-img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 3px solid #fff; box-shadow: 0 0 20px #ff4500, 0 0 40px #ff0000;
            position: relative; z-index: 2; background: #000;
        }
        @keyframes rotateFire { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .timer-circle-container {
            position: relative; width: 220px; height: 220px; margin: 0 auto 30px auto;
            display: flex; justify-content: center; align-items: center;
        }
        .timer-circle-container svg { transform: rotate(-90deg); width: 100%; height: 100%; filter: drop-shadow(0 0 15px rgba(230, 57, 70, 0.5)); }
        .circle-bg { fill: none; stroke: #111; stroke-width: 6; }
        .circle-progress {
            fill: none; stroke: url(#redGradient); stroke-width: 6;
            stroke-linecap: round; stroke-dasharray: 628; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear;
        }
        .timer-content {
            position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }
        .time-text {
            font-size: 30px; font-weight: 900; font-family: monospace;
            color: #fff; text-shadow: 0 0 15px rgba(230, 57, 70, 0.8); direction: ltr; letter-spacing: 2px;
        }
        .time-label { font-size: 13px; color: #e63946; margin-top: 5px; letter-spacing: 1px; font-weight: 900; }

        .code-display {
            display: flex; border: 1px solid #333; border-radius: 8px;
            overflow: hidden; margin-bottom: 30px; background-color: rgba(5, 5, 5, 0.8);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .code-box { flex: 1; padding: 15px; font-family: monospace; font-size: 16px; color: #aaa; direction: ltr; text-align: center; }
        .btn-copy {
            background-color: #111; color: #fff; border: none; border-right: 1px solid #333;
            padding: 0 20px; font-family: 'Cairo', sans-serif; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-copy:hover { background-color: #222; color: #e63946; }

        .btn-connect {
            display: block; background: linear-gradient(135deg, #e63946 0%, #850c16 100%);
            color: white; text-decoration: none; padding: 18px; font-size: 20px; font-weight: 900;
            border-radius: 8px; box-shadow: 0 10px 30px rgba(230, 57, 70, 0.4); transition: 0.3s;
            border: 1px solid #ff4d4d; width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- الشاشة الأولى -->
        <div id="login-page" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            
            <div class="title-container">
                <div class="title-line"></div>
                <div class="title">تفعيل التطبيق</div>
                <div class="title-line"></div>
            </div>

            <div class="subtitle">أدخل مفتاح التفعيل الخاص بك للتحقق من جهازك</div>

            <!-- خانة الإدخال -->
            <div class="input-box">
                <i class="fa-solid fa-key"></i>
                <input type="text" id="accessCode" placeholder="Nacer-XXXX_XXXX-XXXX" autocomplete="off">
                <button class="paste-btn" onclick="pasteCode()">
                    <i class="fa-regular fa-copy"></i> لصق
                </button>
            </div>

            <!-- صندوق المثال -->
            <div class="example-box">
                <i class="fa-solid fa-circle-info"></i>
                <div>مثال على الصيغة: <span>Nacer-XXXX_XXXX-XXXX</span></div>
            </div>

            <!-- رسالة الخطأ -->
            <div class="error-msg" id="errorMsg">
                <span id="errorText">مفتاح غير صالح</span>
            </div>

            <!-- زر التحقق -->
            <button class="verify-btn" id="mainBtn" onclick="checkCode()">
                <i class="fa-solid fa-shield-halved"></i> تحقق
            </button>

            <!-- رابط القناة في الأسفل -->
            <a href="https://t.me/HAX_NON_ROOT" target="_blank" class="channel-btn">
                انقر هنا لتوجه للقنات الأساسية <i class="fa-solid fa-arrow-left"></i>
            </a>

        </div>

        <!-- الشاشة الثانية -->
        <div id="main-page">
            <a href="https://play.google.com/store/apps/details?id=com.happproxy" target="_blank" class="download-btn-top">اضغط هنا لتحميل الحاقن</a>
            <div class="fire-container"><img src="https://files.catbox.moe/lbr98b.png" class="fire-profile-img"></div>
            <div class="timer-circle-container">
                <svg>
                    <defs><linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff4d4d" /><stop offset="50%" stop-color="#e63946" /><stop offset="100%" stop-color="#550000" /></linearGradient></defs>
                    <circle class="circle-bg" cx="110" cy="110" r="100"></circle>
                    <circle class="circle-progress" id="progressRing" cx="110" cy="110" r="100"></circle>
                </svg>
                <div class="timer-content">
                    <div class="time-text" id="countdownText">00:00:00</div>
                    <div class="time-label">الوقت المتبقي</div>
                </div>
            </div>
            <div class="code-display">
                <div class="code-box" id="currentCode">Nacer-xxxx</div>
                <button class="btn-copy" onclick="copyCode()">نسخ</button>
            </div>
            <a href="happ://add/hysteria2://AMHK-05AF-AB2E-A78E@wraith-bom2.aimhack.shop:443/?insecure=1&sni=wraith-bom2.aimhack.shop#Nacer-Server" class="btn-connect">اتصال الآن ⚡</a>
        </div>

    </div>

    <script>
        const RENDER_API_URL = "https://key-system-yn0o.onrender.com/api/verify";
        let timerInterval;
        let savedCode = "";

        const inputField = document.getElementById("accessCode");
        const errorDiv = document.getElementById("errorMsg");
        const errorText = document.getElementById("errorText");

        async function pasteCode() {
            try {
                const text = await navigator.clipboard.readText();
                inputField.value = text;
            } catch (err) {
                alert("يرجى لصق الكود يدوياً");
            }
        }

        function copyCode() {
            navigator.clipboard.writeText(savedCode).then(() => alert("✅ تم نسخ الكود!"));
        }

        async function checkCode() {
            const inputCode = inputField.value.trim();
            
            if(!inputCode) {
                errorDiv.style.display = "block";
                errorText.innerText = "يرجى إدخال المفتاح أولاً";
                return;
            }

            savedCode = inputCode;
            document.getElementById("currentCode").innerText = inputCode;
            document.getElementById("login-page").style.display = "none";
            document.getElementById("main-page").style.display = "block";
            errorDiv.style.display = "none";
            
            startCountdown(new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString());

            try {
                const response = await fetch(RENDER_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: inputCode, device_id: "device-" + Math.random() })
                });
                
                const data = await response.json();

                if (data.valid === true) {
                    if (data.expires_at) {
                        startCountdown(data.expires_at);
                    }
                } else {
                    document.getElementById("main-page").style.display = "none";
                    document.getElementById("login-page").style.display = "flex";
                    
                    let msg = "مفتاح غير صالح"; 
                    if (data.reason === "code_expired") msg = "مفتاح منتهي صلاحية";
                    
                    errorText.innerText = msg;
                    errorDiv.style.display = "block";
                }
            } catch (error) {
                document.getElementById("main-page").style.display = "none";
                document.getElementById("login-page").style.display = "flex";
                errorText.innerText = "تعذر الاتصال بالسيرفر. يرجى المحاولة لاحقاً.";
                errorDiv.style.display = "block";
            }
        }

        function startCountdown(expiryDateString) {
            const countdownText = document.getElementById("countdownText");
            const progressRing = document.getElementById("progressRing");
            const radius = 100;
            const circumference = 2 * Math.PI * radius;
            const expiryDate = new Date(expiryDateString).getTime();
            
            if(timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = expiryDate - now;
                if (distance < 0) {
                    clearInterval(timerInterval);
                    countdownText.innerText = "00:00:00";
                    countdownText.style.color = "#e63946";
                    progressRing.style.strokeDashoffset = circumference;
                    return;
                }
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                let displayHours = hours < 10 ? '0' + hours : hours;
                let displayMinutes = minutes < 10 ? '0' + minutes : minutes;
                let displaySeconds = seconds < 10 ? '0' + seconds : seconds;
                countdownText.innerText = days > 0 ? `${days}ي : ${displayHours}:${displayMinutes}:${displaySeconds}` : `${displayHours}:${displayMinutes}:${displaySeconds}`;
                const totalMaxTime = 24 * 60 * 60 * 1000;
                let percentage = distance / totalMaxTime;
                if(percentage > 1) percentage = 1;
                const offset = circumference - (percentage * circumference);
                progressRing.style.strokeDashoffset = offset;
            }, 1000);
        }
    </script>
</body>
